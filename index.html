<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NY TRIP - Nueva York 🗽</title>

    <!-- Leaflet CSS (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">🗽</div>
            <h1>NY TRIP</h1>
            <p class="login-subtitle">Inicia sesión para ver tu itinerario</p>

            <form id="login-form">
                <label>
                    Email
                    <input id="login-email" type="email" placeholder="tu@email.com" required>
                </label>

                <label>
                    Contraseña
                    <input id="login-password" type="password" placeholder="••••••••" required>
                </label>

                <button id="login-submit-btn" class="primary-button full" type="submit">
                    Iniciar Sesión
                </button>

                <div id="login-error" class="login-error hidden"></div>
            </form>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="app" class="hidden">

        <header class="app-header">
            <div>
                <h1>NY TRIP 🗽</h1>
                <p id="current-user-email">Cargando...</p>
            </div>
            <div id="connection-status" class="connection-status">● Conectado</div>
        </header>

        <main>

            <!-- 1. INICIO -->
            <section id="screen-home" class="screen active">
                <div class="hero-card">
                    <div>
                        <span style="font-size: 11px; color: var(--text-muted);">Próximo Viaje</span>
                        <h2 style="font-size: 18px; margin: 2px 0;">Nueva York, EE. UU.</h2>
                        <p id="trip-day">Calculando fecha...</p>
                    </div>
                    <div id="header-clocks" style="margin-top: 10px; font-size: 12px; color: var(--text-muted);"></div>
                </div>

                <div class="quick-grid">
                    <button class="quick-button" data-screen="plans"><span>🗺️</span><strong>Planes</strong></button>
                    <button class="quick-button" data-screen="expenses"><span>💸</span><strong>Gastos</strong></button>
                    <button class="quick-button" data-screen="map"><span>📍</span><strong>Mapa</strong></button>
                    <button class="quick-button" data-screen="more"><span>⚙️</span><strong>Ajustes</strong></button>
                </div>

                <div class="section-heading"><h3 style="font-size: 14px; margin-bottom: 8px;">Próxima Actividad</h3></div>
                <div id="next-activity" class="next-card">
                    <p style="font-size: 13px; color: var(--text-muted);">Cargando planes...</p>
                </div>
            </section>

            <!-- 2. PLANES -->
            <section id="screen-plans" class="screen">
                <div class="screen-title">
                    <div>
                        <h2>Plan de Viaje</h2>
                        <p>Itinerario y lugares</p>
                    </div>
                    <button class="primary-button" id="open-plan-form">+ Plan</button>
                </div>

                <div class="plan-filters">
                    <button class="plan-filter active" data-plan-filter="all">Todos</button>
                    <button class="plan-filter" data-plan-filter="food">🍽️ Restaurantes</button>
                    <button class="plan-filter" data-plan-filter="sweet">🍪 Dulces</button>
                    <button class="plan-filter" data-plan-filter="activity">📍 Spots</button>
                    <button class="plan-filter" data-plan-filter="shopping">🛍️ Tiendas</button>
                    <button class="plan-filter" data-plan-filter="sightseeing">🗽 Turisteo</button>
                </div>

                <div id="plan-list" class="list"></div>
            </section>

            <!-- 3. GASTOS -->
            <section id="screen-expenses" class="screen">
                <div class="screen-title">
                    <div>
                        <h2>Gastos</h2>
                        <p>Cuentas claras</p>
                    </div>
                    <button class="primary-button" id="open-expense-form">+ Gasto</button>
                </div>
                <div id="expense-summary"></div>
                <div id="expense-list" class="list"></div>
            </section>

            <!-- 4. MAPA -->
            <section id="screen-map" class="screen">
                <div class="screen-title">
                    <h2>Mapa Interactivo</h2>
                </div>
                <div id="map" style="height: 400px;"></div>
            </section>

            <!-- 5. AJUSTES -->
            <section id="screen-more" class="screen">
                <div class="screen-title">
                    <h2>Opciones</h2>
                </div>
                <div id="hotel-container"></div>
                <div id="flight-list" class="list" style="margin-top: 10px;"></div>
                <div style="margin-top: 20px;">
                    <button id="logout-button" class="danger-button full">Cerrar Sesión</button>
                </div>
            </section>

        </main>

        <nav class="bottom-nav">
            <button class="nav-button active" data-screen="home"><span>🏠</span><small>Inicio</small></button>
            <button class="nav-button" data-screen="plans"><span>📅</span><small>Planes</small></button>
            <button class="nav-button" data-screen="expenses"><span>💸</span><small>Gastos</small></button>
            <button class="nav-button" data-screen="map"><span>📍</span><small>Mapa</small></button>
            <button class="nav-button" data-screen="more"><span>⚙️</span><small>Más</small></button>
        </nav>
    </div>

    <!-- MODAL DE PLANES -->
    <div id="plan-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Guardar Plan</h2>
                <button class="close-modal" data-close="plan-modal">&times;</button>
            </div>
            <form id="plan-form">
                <input type="hidden" id="plan-id">
                <label>Título <input type="text" id="plan-title" required></label>
                <div class="form-row">
                    <label>Fecha <input type="date" id="plan-date"></label>
                    <label>Hora <input type="time" id="plan-time"></label>
                </div>
                <label>Categoría
                    <select id="plan-category">
                        <option value="food">🍽️ Restaurantes</option>
                        <option value="sweet">🍪 Dulces</option>
                        <option value="activity">📍 Spots</option>
                        <option value="shopping">🛍️ Tiendas</option>
                        <option value="sightseeing">🗽 Turisteo</option>
                        <option value="other">📌 Otros</option>
                    </select>
                </label>
                <label>Ubicación <input type="text" id="plan-location"></label>
                <label>Notas <textarea id="plan-description"></textarea></label>
                <button type="submit" class="primary-button full">Guardar</button>
            </form>
        </div>
    </div>

    <!-- MODAL DE GASTOS -->
    <div id="expense-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Añadir Gasto</h2>
                <button class="close-modal" data-close="expense-modal">&times;</button>
            </div>
            <form id="expense-form">
                <label>Concepto <input type="text" id="expense-title" required></label>
                <div class="form-row">
                    <label>Importe <input type="number" step="0.01" id="expense-amount" required></label>
                    <label>Moneda
                        <select id="expense-currency">
                            <option value="USD">USD ($)</option>
                            <option value="EUR">EUR (€)</option>
                        </select>
                    </label>
                </div>
                <label>Pagado por <input type="text" id="expense-paid-by" placeholder="Nombre" required></label>
                <button type="submit" class="primary-button full">Guardar Gasto</button>
            </form>
        </div>
    </div>

    <!-- LIBRERÍAS EXTERNAS Y JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
