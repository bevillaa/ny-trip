
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>NY TRIP</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>


<body>

    <main>

        <!-- ==================================
             CABECERA
        =================================== -->

        <header class="app-header">

            <h1>
                🗽 NY TRIP
            </h1>

            <p>
                El tridente en Nueva York 😈😇🤪
            </p>

        </header>


        <!-- ==================================
             DÍA DEL VIAJE
        =================================== -->

        <section class="location-card">

            <div>

                <span class="label">
                    📅 VIAJE
                </span>

                <strong id="trip-day">
                    Preparando...
                </strong>

            </div>


            <div class="weather">

                <span>
                    📍
                </span>

                <strong>
                    Nueva York
                </strong>

            </div>

        </section>


        <!-- ==================================
             ¿QUÉ HACEMOS AHORA?
        =================================== -->

        <section class="now-card">

            <p class="section-label">
                ⭐ ¿QUÉ HACEMOS AHORA?
            </p>

            <h2>
                Preparando vuestro viaje...
            </h2>

            <p>
                Aquí aparecerá vuestra próxima actividad.
            </p>

        </section>


        <!-- ==================================
             PLAN DE HOY
        =================================== -->

        <section class="day-plan">

            <div class="section-title">

                <h2>
                    📅 PLAN DE HOY
                </h2>

            </div>


            <div class="activity">

                <span class="activity-time">
                    10:00
                </span>


                <div>

                    <strong>
                        Primera actividad
                    </strong>

                    <p>
                        Añadiremos vuestro itinerario aquí.
                    </p>

                </div>

            </div>


            <div class="activity">

                <span class="activity-time">
                    14:00
                </span>


                <div>

                    <strong>
                        Comida
                    </strong>

                    <p>
                        Reserva o actividad pendiente.
                    </p>

                </div>

            </div>

        </section>


        <!-- ==================================
             ACCIONES RÁPIDAS
        =================================== -->

        <section class="quick-actions">

            <button>
                🚇
                <span>
                    Transporte
                </span>
            </button>


            <button>
                🌦️
                <span>
                    Tiempo
                </span>
            </button>


            <button>
                🍽️
                <span>
                    Comer cerca
                </span>
            </button>


            <button>
                📍
                <span>
                    Cerca de mí
                </span>
            </button>


            <button>
                💰
                <span>
                    Gastos
                </span>
            </button>


            <button>
                📋
                <span>
                    Reservas
                </span>
            </button>

        </section>

    </main>


    <!-- ======================================
         NAVEGACIÓN INFERIOR
    ======================================= -->

    <nav class="bottom-nav">

        <button class="active">

            🏠

            <span>
                Inicio
            </span>

        </button>


        <button>

            🗓️

            <span>
                Plan
            </span>

        </button>


        <button>

            🗺️

            <span>
                Mapa
            </span>

        </button>


        <button>

            💰

            <span>
                Gastos
            </span>

        </button>


        <button>

            ☰

            <span>
                Más
            </span>

        </button>

    </nav>


    <!-- ======================================
         JAVASCRIPT
    ======================================= -->

    <script src="app.js"></script>


    <!-- ======================================
         SERVICE WORKER
    ======================================= -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register(
                            "./service-worker.js"
                        )

                        .then(() => {

                            console.log(
                                "🟢 NY TRIP: modo offline preparado."
                            );

                        })

                        .catch((error) => {

                            console.error(
                                "🔴 NY TRIP: error en Service Worker.",
                                error
                            );

                        });

                }
            );

        }

    </script>

</body>

</html>
