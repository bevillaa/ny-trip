<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NY TRIP</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <!-- Pantalla de Login -->
    <div id="login-screen" style="max-width: 400px; margin: 50px auto; padding: 20px;">
        <h2>Iniciar Sesión</h2>
        <form id="login-form">
            <div>
                <label for="login-email">Correo Electrónico:</label>
                <input type="email" id="login-email" required placeholder="tu@email.com">
            </div>
            <div style="margin-top: 10px;">
                <label for="login-password">Contraseña:</label>
                <input type="password" id="login-password" required placeholder="********">
            </div>
            <div id="login-error" style="color: red; margin-top: 10px;" hidden></div>
            <button type="submit" class="primary-button full" style="margin-top: 15px;">Entrar</button>
        </form>
    </div>

    <!-- Aplicación Principal -->
    <div id="app" hidden>
        <!-- Tu HTML del dashboard/app aquí -->
        <button id="logout-button">Cerrar Sesión</button>
        <span id="current-user-email"></span>
        <span id="connection-status"></span>
        <!-- ... -->
    </div>

    <!-- SDK Supabase (Obligatorio ANTES de app.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Tu archivo principal JS -->
    <script src="app.js"></script>
</body>
</html>
